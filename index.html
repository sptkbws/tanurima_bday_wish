<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Tanurima</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        :root {
            --color-space: #0b0914;
            --color-nebula-purple: #4a154b;
            --color-nebula-pink: #9d2553;
            --color-starlight: #f9e2af;
            --color-gold: #ffd700;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--color-space);
            font-family: 'Montserrat', sans-serif;
            color: white;
        }

        /* Deep Cosmic Background with glowing nebulas */
        .cosmic-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: 
                radial-gradient(circle at 15% 50%, rgba(74, 21, 75, 0.4), transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(157, 37, 83, 0.4), transparent 50%),
                radial-gradient(circle at 50% 80%, rgba(45, 10, 60, 0.6), transparent 60%);
            z-index: 0;
            animation: breathe 10s infinite alternate;
        }

        @keyframes breathe {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.05); opacity: 1; }
        }

        #stage1 {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 50;
            transition: opacity 1.5s ease-out, transform 1.5s ease-in-out;
            background: rgba(11, 9, 20, 0.8);
            backdrop-filter: blur(10px);
        }

        .mysterious-orb {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: radial-gradient(circle, #ffd700 0%, #ff8c00 40%, transparent 70%);
            box-shadow: 0 0 50px #ff8c00, 0 0 100px #ff007f inset;
            cursor: pointer;
            animation: pulseOrb 2s infinite cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .mysterious-orb::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 140px; height: 140px;
            border-radius: 50%;
            border: 2px solid rgba(255, 215, 0, 0.3);
            animation: ripple 2s infinite linear;
        }

        @keyframes pulseOrb {
            0%, 100% { transform: scale(1); box-shadow: 0 0 40px #ff8c00, 0 0 80px #ff007f inset; }
            50% { transform: scale(1.15); box-shadow: 0 0 80px #ffd700, 0 0 120px #ff007f inset, 0 0 30px white; }
        }

        @keyframes ripple {
            0% { width: 120px; height: 120px; opacity: 1; }
            100% { width: 200px; height: 200px; opacity: 0; }
        }

        .unlock-text {
            margin-top: 3rem;
            font-size: 1.2rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #fff, #ffd700, #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmerText 2s infinite linear;
        }

        @keyframes shimmerText {
            0% { background-position: -200% center; }
            100% { background-position: 200% center; }
        }

        #stage3 {
            position: absolute;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 20;
            opacity: 0;
            pointer-events: none;
            transition: opacity 2s ease-in;
            padding: 1rem;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 24px;
            padding: 3rem 2rem;
            max-width: 800px;
            width: 100%;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0,0,0,0.6), inset 0 0 20px rgba(255,255,255,0.05);
            transform: translateY(30px);
            transition: transform 1.5s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .glass-panel.active {
            transform: translateY(0);
        }

        .title-glow {
            font-family: 'Cinzel', serif;
            font-size: clamp(2.5rem, 5vw, 4.5rem);
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 1.5rem;
            background: linear-gradient(135deg, #ffd700, #ffb6ff, #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.4));
            opacity: 0;
        }

        .typewriter-container {
            font-size: clamp(1rem, 2vw, 1.25rem);
            line-height: 1.8;
            color: #e2e8f0;
            min-height: 120px; /* Prevent layout shift */
            margin: 0 auto;
            max-width: 90%;
        }

        .cursor {
            display: inline-block;
            width: 2px;
            height: 1.2em;
            background-color: var(--color-gold);
            vertical-align: middle;
            animation: blink 0.8s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        #stage4 {
            position: absolute;
            inset: 0;
            z-index: 30;
            pointer-events: none; /* Let clicks pass through except on floaters */
        }

        .floater {
            position: absolute;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.8), rgba(255, 215, 0, 0.4));
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.6), inset 0 0 10px white;
            cursor: pointer;
            pointer-events: auto;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
            animation: floatUp 15s linear infinite;
        }

        .floater::before {
            content: '✨';
            font-size: 1.2rem;
            filter: drop-shadow(0 0 5px white);
        }

        .floater:hover {
            transform: scale(1.2);
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.9), inset 0 0 15px white;
        }

        .floater.popped {
            background: transparent;
            box-shadow: none;
            animation: none;
            width: auto;
            height: auto;
        }
        
        .floater.popped::before {
            display: none;
        }

        .wish-text {
            opacity: 0;
            transform: scale(0.5) translateY(20px);
            font-family: 'Cinzel', serif;
            font-weight: 700;
            font-size: 1.2rem;
            color: #ffd700;
            text-shadow: 0 0 10px rgba(0,0,0,0.8), 0 0 20px #ff007f;
            white-space: nowrap;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .floater.popped .wish-text {
            opacity: 1;
            transform: scale(1.2) translateY(-20px);
        }

        @keyframes floatUp {
            0% { transform: translateY(110vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }

        #fireflyCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- Audio Player (Hidden) -->
    <audio id="bgMusic" loop preload="auto">
        <!-- Using a high-quality royalty free ambient space/piano track -->
        <source src="https://cdn.pixabay.com/download/audio/2022/01/18/audio_d0a13f69d2.mp3?filename=ambient-piano-amp-strings-10711.mp3" type="audio/mpeg">
    </audio>

    <div class="cosmic-bg"></div>
    <canvas id="fireflyCanvas"></canvas>

    <!-- Stage 1: Intro -->
    <div id="stage1">
        <div class="mysterious-orb" onclick="unlockMagic()"></div>
        <div class="unlock-text">Tap to Unlock the Magic</div>
    </div>

    <!-- Stage 3: Main Content (Revealed after Stage 2 explosion) -->
    <div id="stage3">
        <div class="glass-panel" id="mainCard">
            <h1 class="title-glow" id="bdayTitle">Happy Birthday<br/>Tanurima!</h1>
            <div class="w-1/4 h-[2px] mx-auto bg-gradient-to-r from-transparent via-yellow-400 to-transparent mb-8 opacity-50"></div>
            <div class="typewriter-container">
                <span id="typedMessage"></span><span class="cursor"></span>
            </div>
        </div>
    </div>

    <!-- Stage 4: Interactive Floating Elements Container -->
    <div id="stage4"></div>

    <script>
        const messages = [
            "Wishing you a universe of happiness today and always.",
            "You are the brightest star in our galaxy, the best junior ever!",
            "May your year be filled with magical moments, immense success, and endless joy.",
            "Keep shining, keep smiling, and keep being your awesome self."
        ];
        
        const shortCompliments = [
            "Keep shining! ✨", 
            "Stay awesome! 🚀", 
            "Best junior ever! 👑", 
            "You're a star! 🌟", 
            "Unstoppable! 💫", 
            "Pure genius! 🧠",
            "Keep smiling! 😊"
        ];

        // Canvas Fireflies System
        const canvas = document.getElementById('fireflyCanvas');
        const ctx = canvas.getContext('2d');
        let fireflies = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Firefly {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 1;
                this.speedX = Math.random() * 1 - 0.5;
                this.speedY = Math.random() * 1 - 0.5;
                this.color = Math.random() > 0.5 ? '#ffd700' : '#ffb6ff';
                this.glow = Math.random() * 10 + 5;
                this.opacity = Math.random();
                this.fade = Math.random() * 0.02 + 0.01;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                
                if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
                if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;

                this.opacity += this.fade;
                if (this.opacity > 1 || this.opacity < 0.1) this.fade *= -1;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(${this.color === '#ffd700' ? '255,215,0' : '255,182,255'}, ${this.opacity})`;
                ctx.shadowBlur = this.glow;
                ctx.shadowColor = this.color;
                ctx.fill();
            }
        }

        function initFireflies() {
            for (let i = 0; i < 50; i++) fireflies.push(new Firefly());
            animateFireflies();
        }

        function animateFireflies() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            fireflies.forEach(f => {
                f.update();
                f.draw();
            });
            requestAnimationFrame(animateFireflies);
        }
        initFireflies();

        function unlockMagic() {
            // Start Audio
            const bgMusic = document.getElementById('bgMusic');
            bgMusic.volume = 0.5;
            bgMusic.play().catch(e => console.log("Audio play blocked by browser policies until interaction."));

            // Hide Stage 1
            const stage1 = document.getElementById('stage1');
            stage1.style.transform = 'scale(1.5)';
            stage1.style.opacity = '0';
            setTimeout(() => {
                stage1.style.display = 'none';
            }, 1500);

            // Stage 2: Massive Confetti Explosion
            setTimeout(() => {
                fireSpectacularConfetti();
            }, 300);

            // Stage 3: Reveal Main Content
            setTimeout(() => {
                revealMainContent();
                spawnFloatingElements(); // Start Stage 4
            }, 2500);
        }

        function fireSpectacularConfetti() {
            const duration = 4000;
            const end = Date.now() + duration;

            (function frame() {
                confetti({
                    particleCount: 8,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0, y: 0.8 },
                    colors: ['#ffd700', '#ff007f', '#ffffff']
                });
                confetti({
                    particleCount: 8,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1, y: 0.8 },
                    colors: ['#ffd700', '#ff007f', '#ffffff']
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            }());

            // Center burst
            setTimeout(() => {
                confetti({
                    particleCount: 150,
                    spread: 100,
                    origin: { y: 0.5 },
                    colors: ['#ffd700', '#ffb6ff', '#ffffff', '#4a154b'],
                    disableForReducedMotion: true
                });
            }, 500);
        }

        function revealMainContent() {
            const stage3 = document.getElementById('stage3');
            const card = document.getElementById('mainCard');
            const title = document.getElementById('bdayTitle');

            stage3.style.pointerEvents = 'auto';
            stage3.style.opacity = '1';
            card.classList.add('active');
            
            // Fade in title
            setTimeout(() => {
                title.style.transition = 'opacity 2s ease, filter 2s ease';
                title.style.opacity = '1';
                
                // Start typing message
                setTimeout(() => {
                    typeMessage();
                }, 1500);
            }, 500);
        }

        let currentMsgIdx = 0;
        let currentCharIdx = 0;
        let isTyping = true;
        const typedSpan = document.getElementById('typedMessage');

        function typeMessage() {
            if (currentMsgIdx < messages.length) {
                const currentText = messages[currentMsgIdx];
                
                if (isTyping) {
                    if (currentCharIdx < currentText.length) {
                        typedSpan.innerHTML += currentText.charAt(currentCharIdx);
                        currentCharIdx++;
                        setTimeout(typeMessage, 40); // Typing speed
                    } else {
                        isTyping = false;
                        setTimeout(typeMessage, 2000); // Pause at end of sentence
                    }
                } else {
                    // Prepare next sentence
                    typedSpan.innerHTML += "<br><br>";
                    currentMsgIdx++;
                    currentCharIdx = 0;
                    isTyping = true;
                    setTimeout(typeMessage, 300);
                }
            } else {
                // Done typing
                document.querySelector('.cursor').style.display = 'none';
            }
        }

        function spawnFloatingElements() {
            const container = document.getElementById('stage4');
            
            setInterval(() => {
                if(document.querySelectorAll('.floater').length > 8) return; // Limit on screen

                const floater = document.createElement('div');
                floater.className = 'floater';
                
                // Randomize position and animation properties
                floater.style.left = `${Math.random() * 80 + 10}vw`;
                floater.style.animationDuration = `${Math.random() * 10 + 10}s`;
                
                const wishText = document.createElement('span');
                wishText.className = 'wish-text';
                wishText.innerText = shortCompliments[Math.floor(Math.random() * shortCompliments.length)];
                
                floater.appendChild(wishText);

                // Click event to pop
                floater.addEventListener('click', function(e) {
                    if (this.classList.contains('popped')) return;
                    
                    this.classList.add('popped');
                    
                    // Mini confetti at click position
                    confetti({
                        particleCount: 30,
                        spread: 60,
                        origin: {
                            x: e.clientX / window.innerWidth,
                            y: e.clientY / window.innerHeight
                        },
                        colors: ['#ffd700', '#ffffff']
                    });

                    // Remove after reading
                    setTimeout(() => {
                        this.style.opacity = '0';
                        setTimeout(() => this.remove(), 1000);
                    }, 2500);
                });

                container.appendChild(floater);

                // Auto remove if it goes off screen
                setTimeout(() => {
                    if (floater && floater.parentNode && !floater.classList.contains('popped')) {
                        floater.remove();
                    }
                }, 25000); 

            }, 2000); // Spawn a new one every 2 seconds
        }
    </script>
</body>
</html>
